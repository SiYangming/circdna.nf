name: repeatexplorer2
description: RepeatExplorer2 (seqclust) clustering of repetitive elements from NGS reads
keywords:
  - repeat_explorer
  - seqclust
  - clustering
  - eccdna
tools:
  - repeatexplorer:
      description: RepeatExplorer2 - repetitive sequence discovery and classification
      homepage: https://repeatexplorer.org/
      documentation: https://github.com/fjdu/repeat_explorer_2
      licence: ["GPL-3.0-or-later"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - reads_fa:
      type: file
      description: REPEATEXPLORER_READY.fa (concatenated interlaced reads, TR/CO prefixed)
      pattern: "*.fa"
  - taxon:
      type: string
      description: Taxon selector (vir or met)
output:
  - clu_dir:
      type: directory
      description: seqclust output directory (seqclust/clustering/...)
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@siyangming"
