name: "find_circ_filter"
description: Filter find_circ sites.bed to circular junctions and emit standard BED6
keywords:
  - eccDNA
  - circRNA
  - filter
  - find_circ
  - bed
tools:
  - "find_circ":
      description: "Detect head-to-tail spliced (circular) RNA/DNA junctions from sequencing reads"
      homepage: "https://github.com/marvin-jens/find_circ"
      documentation: "https://github.com/marvin-jens/find_circ"
      doi: "10.1038/nsmb.2590"
      licence:
        - "MIT"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bed:
        type: file
        description: Raw find_circ sites.bed
        pattern: "*.bed"
        ontologies: []
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*_find_circ.bed":
          type: file
          description: Filtered circular junctions as BED6
          pattern: "*_find_circ.bed"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
