name: "find_circ"
description: Align anchors with Bowtie2 and detect circular junctions with find_circ.py
keywords:
  - eccDNA
  - circRNA
  - junction
  - find_circ
  - bowtie2
tools:
  - "find_circ":
      description: "Detect head-to-tail spliced (circular) RNA/DNA junctions from sequencing reads"
      homepage: "https://github.com/marvin-jens/find_circ"
      documentation: "https://github.com/marvin-jens/find_circ"
      doi: "10.1038/nsmb.2590"
      licence:
        - "MIT"
      identifier: biotools:find_circ
  - "bowtie2":
      description: "Fast and sensitive read alignment"
      homepage: "http://bowtie-bio.sourceforge.net/bowtie2/"
      licence:
        - "GPL-3.0-or-later"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - anchors:
        type: file
        description: Gzipped anchor FASTQ from FIND_CIRC_ANCHORS
        pattern: "*.{qfa.gz,fastq.gz,fq.gz}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing genome information
          e.g. [ id:'genome' ]
    - index:
        type: directory
        description: Bowtie2 index directory
        pattern: "*"
        ontologies: []
  - fasta:
      type: file
      description: Reference genome FASTA
      pattern: "*.{fa,fasta,fna}"
      ontologies: []
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*.sites.bed":
          type: file
          description: find_circ splice-site BED (circular and linear)
          pattern: "*.sites.bed"
          ontologies: []
  reads:
    - "*.sites.reads":
        type: file
        description: Spliced read sequences supporting junctions
        pattern: "*.sites.reads"
        ontologies: []
  log:
    - "*.sites.log":
        type: file
        description: find_circ run statistics
        pattern: "*.sites.log"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
