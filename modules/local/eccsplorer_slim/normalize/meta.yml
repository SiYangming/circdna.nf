name: eccsplorer_slim_normalize
description: Normalize coverage data to RPM (Reads Per Million mapped bases) and calculate fold enrichment vs genome background. R-based normalization from ECCsplorer.
keywords:
  - normalization
  - RPM
  - enrichment
tools:
  - normalize.R:
      description: Standalone normalization R script from ECCsplorer slim
      homepage: https://github.com/crimBubble/ECCsplorer
      licence: ["GPL-3.0-or-later"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - coverage_csv:
      type: file
      description: Raw coverage CSV/TSV file (chr, start, end, coverage columns)
      pattern: "*.csv"
  - mapped_bases:
      type: value
      description: Comma-separated string or list of mapped base counts per sample
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - normalized:
      type: file
      description: Normalized coverage CSV file with RPM values and enrichment scores
      pattern: "*_normalized.csv"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@siyangming"
