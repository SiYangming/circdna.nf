name: tidehunter
description: Efficient and sensitive tandem repeat detection from noisy long reads using seed-and-chain
keywords:
  - tandem_repeat
  - long_reads
  - eccDNA
tools:
  - tidehunter:
      description: Tandem repeat detection from noisy long reads
      homepage: https://github.com/yangao07/TideHunter
      documentation: https://github.com/yangao07/TideHunter
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - reads:
      type: file
      description: Long-read sequences (FASTA or FASTQ)
      pattern: "*.{fa,fasta,fq,fastq,fa.gz,fasta.gz,fq.gz,fastq.gz}"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - cons_fa:
      type: file
      description: Consensus sequences of detected tandem repeats
      pattern: "*.fasta"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@siyangming"
