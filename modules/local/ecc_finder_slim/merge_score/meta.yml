name: "ecc_finder_slim/merge_score"
description: "Merge Genrich enrichment sites with TideHunter split reads, score eccDNA candidates, and extract sequences from reference genome."
keywords:
  - eccdna
  - circular dna
  - enrichment
  - split reads
  - merge
  - scoring
tools:
  - "ecc_finder_slim":
      description: "Minimal ecc_finder analysis scripts for merge/scoring (no external bioinfo tools)"
      homepage: "https://quay.io/bioinfortools/ecc_finder_slim"
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - enrichment_bed:
        type: file
        description: Genrich enrichment sites BED file (chr, start, end)
        pattern: "*.bed"
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - splitreads_bed:
        type: file
        description: TideHunter split reads BED file (chr, start, end, read_id)
        pattern: "*.bed"
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference genome information
          e.g. `[ id:'genome' ]`
    - ref:
        type: file
        description: Reference genome in FASTA format
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
output:
  - csv:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.csv":
          type: file
          description: Candidate eccDNA table (candidate_id, chr, start, end, supporting_reads, confidence_score)
          pattern: "*.csv"
  - fasta:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.fasta":
          type: file
          description: Extracted eccDNA candidate sequences
          pattern: "*.fasta"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
