{% set name = "fled" %}
{% set version = "1.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: .

build:
  number: 1
  noarch: generic

requirements:
  host:
    - python ==3.8.*
    - pip
  run:
    - python ==3.8.*
    - networkx==2.5
    - biopython==1.76
    - numpy>=1.19.1
    - scipy==1.5.3
    - tqdm>=4.51.0
    - minimap2
    - samtools
    - bedtools
    - seqtk

about:
  home: https://github.com/FuyuLi/FLED
  license: MIT
  summary: 'FLED: a full-length eccDNA detector for long-reads sequencing data'
