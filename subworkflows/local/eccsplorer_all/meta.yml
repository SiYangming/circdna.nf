# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ECCSPLORER_ALL"
description: "Skeleton subworkflow for ECCsplorer all/comparative mode. Preserves control-aware metadata routing while reusing the clu skeleton and remaining disconnected from the active pipeline branches."
keywords:
  - eccsplorer
  - eccdna
  - comparative
  - cluster
components:
  - eccsplorer_cluster
input:
  - treatment_reads:
      description: |
        Input treatment read channel for the ECCsplorer all/comparative skeleton.
        Structure: [ val(meta), path(reads) ]
  - control_reads:
      description: |
        Optional control read channel used to annotate comparative metadata.
        Structure: [ val(meta), path(reads) ]
  - fasta_meta:
      description: |
        Reference genome FASTA channel.
        Structure: [ val(meta), path(fasta) ]
  - run_clu:
      type: boolean
      description: Whether to materialize the clu skeleton path inside all/comparative mode
  - run_candidates_plot:
      type: boolean
      description: Whether to materialize the plotting skeleton stage
output:
  - versions:
      description: |
        Files containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
