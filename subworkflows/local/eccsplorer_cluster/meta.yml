# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ECCSPLORER_CLUSTER"
description: "Skeleton subworkflow for ECCsplorer clu mode. Stages placeholder prepare, core and plotting steps so the branch can be safely included before a full implementation is wired into the pipeline."
keywords:
  - eccsplorer
  - eccdna
  - cluster
components:
  - eccsplorer_clu_prepare
  - eccsplorer_clu_core
  - eccsplorer_clu_candidates_plot
input:
  - reads:
      description: |
        Input read channel for the ECCsplorer clu skeleton.
        Structure: [ val(meta), path(reads) ]
  - fasta_meta:
      description: |
        Reference genome FASTA channel.
        Structure: [ val(meta), path(fasta) ]
  - run_prepare:
      type: boolean
      description: Whether to materialize the prepare skeleton stage
  - run_core:
      type: boolean
      description: Whether to materialize the clu core skeleton stage
  - run_candidates_plot:
      type: boolean
      description: Whether to materialize the clu plotting skeleton stage
output:
  - versions:
      description: |
        Files containing software versions
        Structure: [ path(versions.yml) ]
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
