## `circleseeker_pipeline`
Run CircleSeeker eccDNA detection on PacBio HiFi long reads and convert the
merged CSV output to a BED6+read_count table for downstream candidate filtering.

### Inputs

| Name      | Type     | Description |
|-----------|----------|-------------|
| reads     | channel  | `[ val(meta), fastq ]` HiFi reads (FASTA/FASTQ, gz/plain) |
| genome_fasta | channel | Reference genome FASTA file |

### Outputs

| Name     | Type     | Description |
|----------|----------|-------------|
| merged   | channel  | `[ val(meta), <prefix>_merged_output.csv ]` |
| bed      | channel  | `[ val(meta), <prefix>.circleseeker.bed ]` |
| summary  | channel  | `[ val(meta), <prefix>_summary.txt ]` |
| report   | channel  | `[ val(meta), <prefix>_report.html ]` |
| versions | channel  | Software versions |
